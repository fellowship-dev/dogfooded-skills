<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>DX weekly trends</title>
<style>
/* ---------------------------------------------------------------------------
   dx-metrics weekly trends — ONE self-contained file.

   NO JAVASCRIPT AT ALL. Every chart is inline SVG generated server-side by
   scripts/dxm-trends.sh; tooltips are native SVG <title> elements. That is a
   deliberate hardening choice, not minimalism: the sibling dashboard renders
   its charts from inlined JSON at load time, and a single render-time
   exception there leaves a blank page while the file size, the byte count and
   the ok:true envelope all still look healthy. A page with no script cannot
   fail that way, and it is trivially CSP-safe.

   No CDN, no external font, no external image, no network request of any kind.
   --------------------------------------------------------------------------- */

/* Complete light palette on bare :root, so a viewer whose OS is set to
   "system" (which stamps no attribute at all) still gets every token. */
:root {
  --bg:        #faf9f7;
  --panel:     #ffffff;
  --panel-2:   #f4f2ee;
  --ink:       #17160f;
  --ink-2:     #45433a;
  --muted:     #6f6d63;
  --line:      #e3e0d8;
  --line-2:    #cfcbc0;
  --grid:      #e8e5dd;
  --accent:    #2f5fd0;
  --accent-2:  #7d93c8;
  --ai:        #6b3fa0;
  --ml:        #b5651d;
  --ok:        #14684a;
  --warn-ink:  #7a4f00;
  --warn-bg:   #fff5e0;
  --warn-line: #e8c877;
  --alert-ink: #8f1d1d;
  --alert-bg:  #fdecec;
  --alert-line:#eab4b4;
  --shadow:    0 1px 2px rgba(20,18,10,.06), 0 4px 14px rgba(20,18,10,.05);
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
/* Dark redefines tokens only — never a colour's only definition. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#14150f; --panel:#1c1e17; --panel-2:#23261d; --ink:#eeeade; --ink-2:#c6c2b4;
    --muted:#8f8c80; --line:#2f3228; --line-2:#414534; --grid:#2b2e24;
    --accent:#8fb0ff; --accent-2:#5b6f9e; --ai:#c4a2ec; --ml:#e0a06a; --ok:#5fd0a4;
    --warn-ink:#f0c979; --warn-bg:#2c2413; --warn-line:#5c4a1e;
    --alert-ink:#f3a3a3; --alert-bg:#2e1717; --alert-line:#5f2a2a;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --bg:#14150f; --panel:#1c1e17; --panel-2:#23261d; --ink:#eeeade; --ink-2:#c6c2b4;
  --muted:#8f8c80; --line:#2f3228; --line-2:#414534; --grid:#2b2e24;
  --accent:#8fb0ff; --accent-2:#5b6f9e; --ai:#c4a2ec; --ml:#e0a06a; --ok:#5fd0a4;
  --warn-ink:#f0c979; --warn-bg:#2c2413; --warn-line:#5c4a1e;
  --alert-ink:#f3a3a3; --alert-bg:#2e1717; --alert-line:#5f2a2a;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
}

* { box-sizing: border-box; }
html, body { margin:0; padding:0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size:15px; line-height:1.5;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1120px; margin:0 auto; padding: 32px 20px 90px; }

h1 { font-size:26px; line-height:1.2; margin:0 0 6px; letter-spacing:-.01em; }
.sub { color: var(--muted); font-size:13px; font-family: var(--mono); margin-bottom:22px; }
h2 { font-size:13px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted);
     margin:38px 0 12px; padding-bottom:8px; border-bottom:1px solid var(--line); }
h3 { font-size:15px; margin:0 0 2px; }

.banner { border-radius:10px; padding:14px 16px; margin:0 0 14px;
          border:1px solid var(--alert-line); background:var(--alert-bg); color:var(--alert-ink); }
.banner.warn { border-color:var(--warn-line); background:var(--warn-bg); color:var(--warn-ink); }
.banner .t { font-weight:700; letter-spacing:.02em; text-transform:uppercase; font-size:12px; margin-bottom:5px; }
.banner p { margin:0 0 6px; font-size:13.5px; } .banner p:last-child { margin-bottom:0; }
.banner ul { margin:6px 0 0; padding-left:20px; font-size:13.5px; }

.note { background:var(--panel-2); border:1px solid var(--line); border-radius:10px;
        padding:14px 16px; font-size:13.5px; color:var(--ink-2); margin:0 0 14px; }
.note dt { font-weight:700; color:var(--ink); margin-top:8px; font-size:13px; }
.note dt:first-child { margin-top:0; }
.note dd { margin:2px 0 0; }
.note code { font-family:var(--mono); font-size:12.5px; background:var(--panel); padding:1px 4px;
             border:1px solid var(--line); border-radius:4px; }

.card { background:var(--panel); border:1px solid var(--line); border-radius:12px;
        padding:16px 18px 10px; margin:0 0 16px; box-shadow:var(--shadow); }
.card .cap { color:var(--muted); font-size:12.5px; margin:0 0 10px; }
.card .cap b { color:var(--ink-2); font-weight:600; }

.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(330px, 1fr)); gap:14px; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px 6px; }
.panel .ttl { font-size:13px; font-weight:600; margin:0 0 1px; word-break:break-word; }
.panel .meta { font-size:11.5px; color:var(--muted); font-family:var(--mono); margin:0 0 4px; }

svg { display:block; width:100%; height:auto; overflow:visible; }
svg text { font-family:var(--sans); fill:var(--muted); }
svg .axis { stroke:var(--line-2); stroke-width:1; }
svg .grid { stroke:var(--grid); stroke-width:1; }
svg .ylab, svg .xlab { font-size:9.5px; }
svg .axtitle { font-size:10px; fill:var(--muted); letter-spacing:.04em; }
svg rect.bar { fill:var(--accent); }
svg rect.bar.pr { fill:var(--ok); }
svg rect.bar.partial { fill:none; stroke:var(--accent); stroke-width:1; stroke-dasharray:2 2; }
svg rect.bar.pr.partial { fill:none; stroke:var(--ok); }
svg polyline { fill:none; stroke-width:1.6; }
svg polyline.s0 { stroke:var(--ml); } svg polyline.s1 { stroke:var(--ai); }
svg circle.s0 { fill:var(--ml); } svg circle.s1 { fill:var(--ai); }
svg circle.partial { fill:var(--panel); stroke-width:1.4; }
svg circle.s0.partial { stroke:var(--ml); } svg circle.s1.partial { stroke:var(--ai); }
svg .hit { fill:transparent; }

.legend { font-size:12px; color:var(--muted); margin:0 0 8px; display:flex; gap:16px; flex-wrap:wrap; }
.legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px; }
.legend .ml i { background:var(--ml); } .legend .ai i { background:var(--ai); }
.legend .pt i { background:none; border:1px dashed var(--muted); }

table { border-collapse:collapse; width:100%; font-size:13px; margin-top:6px; }
th, td { text-align:right; padding:6px 8px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
th:first-child, td:first-child { text-align:left; font-family:var(--mono); font-size:12px; }
th { color:var(--muted); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; }
.tablewrap { overflow-x:auto; }

footer { margin-top:44px; padding-top:16px; border-top:1px solid var(--line);
         color:var(--muted); font-size:12px; font-family:var(--mono); }
</style>
</head>
<body>
<div class="wrap">
__DXM_TRENDS_BODY__
</div>
</body>
</html>
